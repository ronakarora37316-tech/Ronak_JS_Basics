```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rock Paper Scissors Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }

        .choice {
            font-size: 40px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #f1f1f1;
            cursor: pointer;
            transition: 0.3s;
        }

        .choice:hover {
            transform: scale(1.1);
            background: #ddd;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
        }

        .score {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            font-size: 18px;
        }

        .score p {
            font-weight: bold;
        }

        #reset {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #reset:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>Rock Paper Scissors</h1>

        <p>Choose your move:</p>

        <div class="choices">

            <button class="choice" onclick="playGame('rock')">
                ✊
            </button>

            <button class="choice" onclick="playGame('paper')">
                ✋
            </button>

            <button class="choice" onclick="playGame('scissors')">
                ✌️
            </button>

        </div>

        <div id="result">
            Make your choice!
        </div>

        <div class="score">
            <p>You: <span id="playerScore">0</span></p>
            <p>Computer: <span id="computerScore">0</span></p>
        </div>

        <button id="reset" onclick="resetGame()">
            Reset Game
        </button>

    </div>


    <script>

        let playerScore = 0;
        let computerScore = 0;


        function playGame(playerChoice) {

            // Computer choices
            const choices = ["rock", "paper", "scissors"];

            // Generate random computer choice
            const computerChoice =
                choices[Math.floor(Math.random() * 3)];


            let result = "";


            // Check result
            if (playerChoice === computerChoice) {

                result = "It's a Draw! 🤝";

            }

            else if (
                (playerChoice === "rock" &&
                    computerChoice === "scissors") ||

                (playerChoice === "paper" &&
                    computerChoice === "rock") ||

                (playerChoice === "scissors" &&
                    computerChoice === "paper")
            ) {

                result = "You Win! 🎉";
                playerScore++;

            }

            else {

                result = "Computer Wins! 🤖";
                computerScore++;

            }


            // Display result
            document.getElementById("result").innerHTML =
                "You chose: <b>" + playerChoice +
                "</b><br>Computer chose: <b>" +
                computerChoice +
                "</b><br><br>" +
                result;


            // Update score
            document.getElementById("playerScore").textContent =
                playerScore;

            document.getElementById("computerScore").textContent =
                computerScore;
        }


        // Reset game
        function resetGame() {

            playerScore = 0;
            computerScore = 0;

            document.getElementById("playerScore").textContent = 0;
            document.getElementById("computerScore").textContent = 0;

            document.getElementById("result").textContent =
                "Make your choice!";
        }

    </script>

</body>

</html>
