<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            width: 320px;
            background: #222;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .display {
            width: 100%;
            height: 70px;
            background: white;
            border: none;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 30px;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .number {
            background: #444;
            color: white;
        }

        .operator {
            background: #ff9500;
            color: white;
        }

        .clear {
            background: #e74c3c;
            color: white;
        }

        .equal {
            background: #27ae60;
            color: white;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" id="display" class="display" value="0" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="deleteNumber()">⌫</button>
            <button class="operator" onclick="addOperator('%')">%</button>
            <button class="operator" onclick="addOperator('/')">÷</button>

            <button class="number" onclick="addNumber('7')">7</button>
            <button class="number" onclick="addNumber('8')">8</button>
            <button class="number" onclick="addNumber('9')">9</button>
            <button class="operator" onclick="addOperator('*')">×</button>

            <button class="number" onclick="addNumber('4')">4</button>
            <button class="number" onclick="addNumber('5')">5</button>
            <button class="number" onclick="addNumber('6')">6</button>
            <button class="operator" onclick="addOperator('-')">−</button>

            <button class="number" onclick="addNumber('1')">1</button>
            <button class="number" onclick="addNumber('2')">2</button>
            <button class="number" onclick="addNumber('3')">3</button>
            <button class="operator" onclick="addOperator('+')">+</button>

            <button class="number zero" onclick="addNumber('0')">0</button>
            <button class="number" onclick="addNumber('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>

    </div>

    <script>
        let display = document.getElementById("display");

        function addNumber(number) {
            if (display.value === "0") {
                display.value = number;
            } else {
                display.value += number;
            }
        }

        function addOperator(operator) {
            let lastCharacter = display.value.slice(-1);

            if ("+-*/%".includes(lastCharacter)) {
                return;
            }

            display.value += operator;
        }

        function clearDisplay() {
            display.value = "0";
        }

        function deleteNumber() {
            if (display.value.length === 1) {
                display.value = "0";
            } else {
                display.value = display.value.slice(0, -1);
            }
        }

        function calculate() {
            try {
                let result = eval(display.value);
                display.value = result;
            } catch (error) {
                display.value = "Error";
            }
        }
    </script>

</body>

</html>
