<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        #status {
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .game {
            width: 330px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .cell {
            width: 105px;
            height: 105px;
            background: white;
            border: 2px solid #333;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover {
            background: #e8e8e8;
        }

        #reset {
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 18px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #reset:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <h1>Tic Tac Toe</h1>
    <div id="status">Player X's Turn</div>

    <div class="game">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>

        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>

        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
    </div>

    <button id="reset" onclick="resetGame()">Reset Game</button>

    <script>
        // Game variables
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameOver = false;

        // Winning combinations
        const winningPatterns = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        // Make a move
        function makeMove(index) {

            // Stop if cell already filled or game is over
            if (board[index] !== "" || gameOver) {
                return;
            }

            board[index] = currentPlayer;

            document.querySelectorAll(".cell")[index].textContent = currentPlayer;

            checkWinner();
        }

        // Check winner
        function checkWinner() {

            for (let pattern of winningPatterns) {

                let a = pattern[0];
                let b = pattern[1];
                let c = pattern[2];

                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[a] === board[c]
                ) {
                    document.getElementById("status").textContent =
                        "Player " + currentPlayer + " Wins!";

                    gameOver = true;
                    return;
                }
            }

            // Check draw
            if (!board.includes("")) {
                document.getElementById("status").textContent =
                    "It's a Draw!";

                gameOver = true;
                return;
            }

            // Change player
            currentPlayer = currentPlayer === "X" ? "O" : "X";

            document.getElementById("status").textContent =
                "Player " + currentPlayer + "'s Turn";
        }

        // Reset game
        function resetGame() {

            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            gameOver = false;

            document.querySelectorAll(".cell").forEach(function(cell) {
                cell.textContent = "";
            });

            document.getElementById("status").textContent =
                "Player X's Turn";
        }
    </script>

</body>
</html>
